<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventário Moto Caldas — Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{--bg:#0f1117;--card:#181b25;--bd:#2a2e42;--tx:#e8eaf2;--tx2:#a0a6bd;--tx3:#6b7089;
        --ac:#e63946;--gn:#2dc653;--bl:#4895ef;--or:#f77f00;--yl:#ffd166;--dg:#e63946}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);padding:18px;max-width:1100px;margin:0 auto}
  h1{font-size:20px;margin-bottom:2px}h1 span{color:var(--ac)}
  h2{font-size:15px;margin-bottom:4px}
  .sub{color:var(--tx3);font-size:12px;margin-bottom:12px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
  .rolar{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--tx3);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
  td{padding:7px 8px;border-bottom:1px solid rgba(42,46,66,.5);vertical-align:top}
  td.mono{font-family:ui-monospace,monospace;white-space:nowrap}
  tr.clicavel{cursor:pointer}tr.clicavel:hover{background:rgba(72,149,239,.08)}
  tr.sel{background:rgba(72,149,239,.12)}
  .btn{background:var(--bl);color:#fff;border:0;border-radius:7px;padding:7px 14px;font-size:13px;cursor:pointer;font-weight:600;white-space:nowrap}
  .btn.sec{background:var(--bd)}.btn.gn{background:var(--gn)}.btn.dg{background:var(--dg)}
  .btn.pq{padding:3px 9px;font-size:12px}
  .btn:disabled{opacity:.5;cursor:default}
  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;white-space:nowrap}
  .b-gn{background:rgba(45,198,83,.15);color:var(--gn)}.b-dg{background:rgba(230,57,70,.15);color:var(--dg)}
  .b-bl{background:rgba(72,149,239,.15);color:var(--bl)}.b-or{background:rgba(247,127,0,.15);color:var(--or)}
  .b-cz{background:rgba(160,166,189,.12);color:var(--tx2)}
  .dif-mais{color:var(--bl);font-weight:700}.dif-menos{color:var(--dg);font-weight:700}.dif-ok{color:var(--gn)}
  input,select{background:var(--bg);border:1px solid var(--bd);color:var(--tx);border-radius:7px;padding:8px 10px;font-size:14px}
  input[type=checkbox]{padding:0;width:16px;height:16px;vertical-align:middle;accent-color:var(--bl)}
  label.chk{font-size:13px;color:var(--tx2);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
  .linha{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .entre{justify-content:space-between}
  .tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .tab{padding:8px 14px;border-radius:8px;background:var(--card);border:1px solid var(--bd);cursor:pointer;font-size:13px;font-weight:600;color:var(--tx2);white-space:nowrap;flex:0 0 auto}
  .tab .n{display:inline-block;margin-left:6px;padding:0 6px;border-radius:8px;background:var(--bd);font-size:11px;color:var(--tx)}
  .tab.ativa{background:var(--bl);color:#fff;border-color:var(--bl)}.tab.ativa .n{background:rgba(255,255,255,.25)}
  .tab.adm{font-weight:500;font-size:12px;padding:8px 11px}
  .tabs .sep{flex:1 0 12px}
  .vazio{color:var(--tx3);text-align:center;padding:24px;font-size:14px}
  #telaSenha{max-width:360px;margin:80px auto;text-align:center}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
  .kpi{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;text-align:center}
  .kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.kpi span{font-size:11px;color:var(--tx3)}
  .kpi small{display:block;font-size:10px;color:var(--tx3);margin-top:2px}
  .nota{font-size:12px;color:var(--tx2);background:rgba(72,149,239,.07);border-left:3px solid var(--bl);padding:8px 10px;border-radius:6px;margin:8px 0}
  .nota.av{background:rgba(247,127,0,.08);border-color:var(--or)}
  .rodadas label{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid rgba(42,46,66,.4);font-size:13px;cursor:pointer}
  details>summary{cursor:pointer;padding:6px 0;font-size:13px}
  #msg{display:none;margin-bottom:10px}
  @media(max-width:700px){body{padding:12px}td,th{padding:5px 5px;font-size:12px}.kpi b{font-size:19px}}
</style>
</head>
<body>
<div id="telaSenha">
  <h1>📦 Inventário <span>Moto Caldas</span></h1>
  <p class="sub">Dashboard de contagens</p>
  <div class="card">
    <div class="linha" style="justify-content:center">
      <input type="password" id="inpSenha" placeholder="Senha da equipe" style="flex:1">
      <button class="btn" onclick="entrar()">Entrar</button>
    </div>
    <p id="senhaErro" style="color:var(--dg);font-size:12px"></p>
  </div>
</div>

<div id="telaMain" style="display:none">
  <div class="linha entre">
    <div><h1>📦 Inventário <span>Moto Caldas</span></h1>
      <p class="sub" id="subtit" style="margin-bottom:0">Contagens recebidas das coletoras, por categoria</p></div>
    <div class="linha" style="margin:0"><button class="btn sec" onclick="carregar()">↻ Recarregar</button>
      <button class="btn sec" onclick="sair()">Sair</button></div>
  </div>
  <p class="nota" id="msg"></p>
  <div class="tabs" id="tabs"></div>
  <div id="conteudo"></div>
</div>

<script>
var API_URL='https://script.google.com/macros/s/AKfycbyopg7jYsO7CAYA39UJ16R8PWRVkWspqczt17pzwllz1RUR_o7KC2D7lacMeuI7y_fzbA/exec';
var SK='inv_dash_senha',TABK='inv_dash_aba';
var contagens=[],mapa=null,estoqueDB=null,estoqueMap={},estoqueMeta=null;
// Categorias: a contagem por prateleira é parte do inventário de capacetes.
var CATS=[
  {id:'capacetes',rot:'Capacetes',ic:'🪖',inclui:['capacetes','prateleira'],base:'capacetes'},
  {id:'diaria',rot:'Diária',ic:'📊',inclui:['diaria'],base:'diaria'},
  {id:'locacao',rot:'Locação',ic:'📍',inclui:['locacao'],base:'locacao'},
  {id:'tipo',rot:'Tipo',ic:'🏷️',inclui:['tipo'],base:'tipo'},
  {id:'roupa',rot:'Roupas',ic:'👕',inclui:['roupa'],base:null},
  {id:'livre',rot:'Livre',ic:'✋',inclui:['livre'],base:null}];
var ADMIN=[{id:'parado',rot:'Estoque parado',ic:'💰'},{id:'bases',rot:'Bases',ic:'📥'},
           {id:'versoes',rot:'Versões',ic:'🆕'},{id:'arquivo',rot:'Arquivo',ic:'🗄️'}];
var abaAtual=(function(){try{return localStorage.getItem(TABK)||'capacetes'}catch(e){return 'capacetes'}})();

function esc(v){return String(v===null||v===undefined?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function senha(){try{return localStorage.getItem(SK)||''}catch(e){return ''}}
function entrar(){var s=document.getElementById('inpSenha').value.trim();if(!s)return;try{localStorage.setItem(SK,s)}catch(e){}testar(s)}
function sair(){try{localStorage.removeItem(SK)}catch(e){}location.reload()}
// Leituras vão por POST: a senha no corpo, nunca na URL (histórico/logs).
// Aceita "action=x&k=v" (forma antiga) ou objeto.
function api(params,senhaUsar){
  var body={};
  if(typeof params==='string')new URLSearchParams(params).forEach(function(v,k){body[k]=v});else body=Object.assign({},params);
  body.senha=senhaUsar||senha();
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(function(r){return r.json()});
}
function postAdmin(body){return api(body)}
function aviso(html,tipo){var m=document.getElementById('msg');if(!html){m.style.display='none';return}m.className='nota'+(tipo==='av'?' av':'');m.innerHTML=html;m.style.display='block'}
function testar(s){
  api({action:'getData'},s).then(function(j){
    if(!j.ok){document.getElementById('senhaErro').textContent='Senha inválida.';try{localStorage.removeItem(SK)}catch(e){}return}
    document.getElementById('telaSenha').style.display='none';
    document.getElementById('telaMain').style.display='block';
    contagens=j.contagens||[];renderTudo();
  }).catch(function(){document.getElementById('senhaErro').textContent='Falha ao falar com o backend.'});
}
function carregar(){
  aviso('⏳ Recarregando…');
  mapa=null;
  api({action:'getData'}).then(function(j){aviso('');if(j.ok){contagens=j.contagens||[];renderTudo()}else aviso('❌ '+esc(j.erro||'falha'),'av')})
  .catch(function(){aviso('❌ Falha ao falar com o backend.','av')});
}
function catDe(c){var k=String(c.categoria||c.modo||'livre');for(var i=0;i<CATS.length;i++)if(CATS[i].inclui.indexOf(k)>=0)return CATS[i].id;return 'livre'}
function contsDe(catId){return contagens.filter(function(c){return catDe(c)===catId})}
function porData(a,b){return new Date(b.recebido_em)-new Date(a.recebido_em)}
function acharCat(id){return CATS.filter(function(c){return c.id===id})[0]}
function fmtData(v){
  if(!v)return'';var d=new Date(v);
  if(isNaN(d))return String(v);
  return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function fmtN(n){return (Number(n)||0).toLocaleString('pt-BR')}
function pct(x){return (x===null||x===undefined||isNaN(x))?'—':x.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%'}
function corPct(x){return x>=95?'var(--gn)':x>=80?'var(--yl)':'var(--dg)'}
function statusBadge(c){return c.status==='ok'?'<span class="badge b-gn">finalizada</span>':c.status==='and'?'<span class="badge b-or">em andamento</span>':'<span class="badge b-cz">—</span>'}
function vazioCont(v){return v===''||v===null||v===undefined}

// ===== NAVEGAÇÃO =====
function renderTudo(){renderTabs();renderAba()}
function renderTabs(){
  var h='';
  CATS.forEach(function(c){
    var n=contsDe(c.id).length;
    if(!n&&c.id!=='capacetes'&&abaAtual!==c.id)return;
    h+='<div class="tab'+(abaAtual===c.id?' ativa':'')+'" onclick="mudarAba(\''+c.id+'\')">'+c.ic+' '+c.rot+'<span class="n">'+n+'</span></div>';
  });
  h+='<span class="sep"></span>';
  ADMIN.forEach(function(a){h+='<div class="tab adm'+(abaAtual===a.id?' ativa':'')+'" onclick="mudarAba(\''+a.id+'\')">'+a.ic+' '+a.rot+'</div>'});
  document.getElementById('tabs').innerHTML=h;
}
function mudarAba(id){abaAtual=id;try{localStorage.setItem(TABK,id)}catch(e){}aviso('');renderTudo();window.scrollTo(0,0)}
function renderAba(){
  var el=document.getElementById('conteudo');
  if(abaAtual==='capacetes'){el.innerHTML=htmlCapacetes();iniciarCapacetes();return}
  if(acharCat(abaAtual)){el.innerHTML=htmlCategoria(acharCat(abaAtual));return}
  if(abaAtual==='parado'){el.innerHTML=HTML_PARADO;carregarEstoque(renderGarimpo);return}
  if(abaAtual==='bases'){el.innerHTML=HTML_BASES;document.getElementById('inpPor').value=(function(){try{return localStorage.getItem('inv_dash_por')||''}catch(e){return ''}})();renderBases();return}
  if(abaAtual==='versoes'){el.innerHTML='<div class="card"><p class="sub">O que mudou em cada atualização — dashboard, backend e coletoras. A versão do app aparece na tela inicial da coletora.</p><div id="versoesArea"></div></div>';renderVersoes();return}
  if(abaAtual==='arquivo'){el.innerHTML=htmlArquivo();return}
  abaAtual='capacetes';renderTudo();
}

// ===== LISTA DE CONTAGENS (comum a todas as categorias) =====
function tabelaContagens(lista,opt){
  opt=opt||{};
  if(!lista.length)return '<div class="vazio">'+(opt.vazio||'Nenhuma contagem desta categoria. Na coletora, use o modo e toque ☁️ Enviar.')+'</div>';
  var h='<div class="rolar"><table><tr>'+(opt.chk?'<th></th>':'')+'<th>Recebida</th><th>Nome</th><th>Nª</th><th>Conferente</th><th>Local</th><th>Status</th><th>Itens</th>'+(opt.semDiv?'':'<th>Diverg.</th>')+'<th>Fab</th></tr>';
  lista.forEach(function(c){
    var id=esc(c.id),d=Number(c.divergencias)||0,nf=Number(c.total_fab)||0;
    h+='<tr class="clicavel" onclick="abrirDetalhe(\''+id+'\')">'+
      (opt.chk?'<td onclick="event.stopPropagation()"><input type="checkbox" class="chkCont" value="'+id+'"></td>':'')+
      '<td style="white-space:nowrap">'+fmtData(c.recebido_em)+'</td><td>'+(c.categoria==='prateleira'?'🗄️ ':'')+esc(c.nome)+'</td><td>'+esc(c.num_contagem)+'</td>'+
      '<td>'+esc(c.conferente)+'</td><td>'+esc(c.locacao)+'</td><td>'+statusBadge(c)+'</td><td>'+esc(c.total_itens)+'</td>'+
      (opt.semDiv?'':'<td>'+(c.categoria==='prateleira'?'<span class="badge b-cz">n/a</span>':'<span class="badge '+(d?'b-dg':'b-gn')+'">'+d+'</span>')+'</td>')+
      '<td>'+(nf?'<span class="badge b-or">⚠ '+nf+'</span>':'')+'</td></tr>';
  });
  return h+'</table></div>';
}
// Pares 1ª × 2ª: mesma categoria e mesmo local, a mais recente de cada rodada.
function paresDe(lista){
  var porLoc={};
  lista.slice().sort(porData).forEach(function(c){
    var k=String(c.locacao||'—'),n=Number(c.num_contagem)||0;if(!n)return;
    porLoc[k]=porLoc[k]||{};if(!porLoc[k][n])porLoc[k][n]=c;
  });
  return Object.keys(porLoc).sort().map(function(k){return {loc:k,r:porLoc[k]}});
}
function htmlPares(lista){
  var ps=paresDe(lista);if(!ps.length)return '';
  var h='<div class="card"><h2>🔁 1ª × 2ª contagem por local</h2><p class="sub">O dashboard junta sozinho a rodada mais recente de cada local. Cruzar compara uma com a outra: igual = confere; diferente = recontar.</p><div class="rolar"><table><tr><th>Local</th><th>1ª</th><th>2ª</th><th></th></tr>';
  ps.forEach(function(p){
    var c1=p.r[1],c2=p.r[2];
    function cel(c){return c?esc(c.conferente||'—')+' <span class="sub" style="display:inline">'+fmtData(c.recebido_em)+'</span> '+statusBadge(c):'<span class="badge b-or">falta</span>'}
    h+='<tr><td><b>'+esc(p.loc)+'</b></td><td>'+cel(c1)+'</td><td>'+cel(c2)+'</td><td>'+
      (c1&&c2?'<button class="btn pq" onclick="cruzarIds([\''+esc(c1.id)+'\',\''+esc(c2.id)+'\'])">Cruzar</button>':(c1?'<button class="btn sec pq" onclick="cruzarIds([\''+esc(c1.id)+'\'])">Só a 1ª × estoque</button>':''))+'</td></tr>';
  });
  return h+'</table></div></div>';
}
function htmlCategoria(cat){
  var lista=contsDe(cat.id).sort(porData),it=0,dv=0,fin=0;
  lista.forEach(function(c){it+=Number(c.total_itens)||0;dv+=Number(c.divergencias)||0;if(c.status==='ok')fin++});
  return '<div class="kpis">'+
    '<div class="kpi"><b>'+lista.length+'</b><span>contagens</span></div>'+
    '<div class="kpi"><b>'+fin+'</b><span>finalizadas</span></div>'+
    '<div class="kpi"><b>'+fmtN(it)+'</b><span>itens nas contagens</span></div>'+
    '<div class="kpi"><b style="color:'+(dv?'var(--dg)':'var(--gn)')+'">'+fmtN(dv)+'</b><span>divergências × base</span></div></div>'+
    htmlPares(lista)+
    '<div class="card"><div class="linha entre"><h2>'+cat.ic+' Contagens — '+cat.rot+'</h2><div class="linha" style="margin:0">'+
      '<button class="btn" onclick="cruzarMarcadas()">Cruzar marcadas</button>'+
      (lista.length?'<button class="btn dg" onclick="encerrarCiclo(\''+cat.id+'\')">💾 Encerrar ciclo</button>':'')+'</div></div>'+
      '<p class="sub">Toque numa linha para ver os itens. Marque 1 contagem para comparar com o estoque, ou 2+ do MESMO local para cruzar entre si.</p>'+
      tabelaContagens(lista,{chk:true})+'</div>'+
    '<div class="card" id="anaCard" style="display:none"></div>'+
    '<div class="card" id="cardDetalhe" style="display:none"></div>';
}

// ===== DETALHE DE UMA CONTAGEM =====
var itensAtual=[],fabAtual=[],contAtual=null;
function abrirDetalhe(id){
  contAtual=contagens.filter(function(c){return String(c.id)===String(id)})[0];if(!contAtual)return;
  var el=document.getElementById('cardDetalhe');el.style.display='block';
  el.innerHTML='<div class="vazio">Carregando itens…</div>';
  api({action:'getItens',id:id}).then(function(j){
    itensAtual=j.ok?(j.itens||[]):[];fabAtual=j.ok?(j.fab||[]):[];renderDetalhe();
    el.scrollIntoView({behavior:'smooth'});
  });
}
function renderDetalhe(){
  var c=contAtual,prat=c.categoria==='prateleira';
  var so=document.getElementById('soDiv')&&document.getElementById('soDiv').checked;
  var roupa=itensAtual.some(function(i){return i.tamanho||i.cor});
  var h='<div class="linha entre"><b>'+esc(c.nome||c.modo)+' — '+esc(c.conferente||'')+' — '+fmtData(c.recebido_em)+' '+statusBadge(c)+'</b><div class="linha" style="margin:0">'+
    (prat?'':'<label class="chk"><input type="checkbox" id="soDiv" '+(so?'checked':'')+' onchange="renderDetalhe()"> só divergências</label>')+
    '<button class="btn gn" onclick="exportarXlsx()">⬇ Excel</button><button class="btn sec" onclick="document.getElementById(\'cardDetalhe\').style.display=\'none\'">✕</button></div></div>';
  if(prat)h+='<p class="nota">Contagem de prateleira: mostra só o que foi bipado ali. O saldo do sistema é o total da loja, então não se compara por prateleira — o confronto com o sistema é nos indicadores da aba Capacetes.</p>';
  var t='<div class="rolar"><table><tr><th>Código</th><th>Descrição</th><th>Local</th>'+(roupa?'<th>Tam.</th><th>Cor</th>':'')+(prat?'':'<th>Sist.</th>')+'<th>Cont.</th>'+(prat?'':'<th>Dif.</th>')+'</tr>',n=0;
  itensAtual.forEach(function(i){
    if(prat&&(vazioCont(i.contado)||Number(i.contado)<=0))return;
    var temSaldo=!vazioCont(i.saldo);
    var dif=temSaldo?Number(i.contado||0)-Number(i.saldo||0):null;
    if(so&&(dif===null||dif===0))return;
    n++;
    var difTxt=dif===null?'—':dif===0?'OK':(dif>0?'+':'')+dif;
    var cls=dif===null?'':dif===0?'dif-ok':dif>0?'dif-mais':'dif-menos';
    t+='<tr><td class="mono">'+esc(i.codigo)+(i.extra?' <span class="badge b-or">EXT</span>':'')+'</td><td>'+esc(i.descricao)+'</td><td>'+esc(i.local)+'</td>'+
      (roupa?'<td>'+esc(i.tamanho)+'</td><td>'+esc(i.cor)+'</td>':'')+
      (prat?'':'<td>'+(temSaldo?esc(i.saldo):'—')+'</td>')+'<td><b>'+(vazioCont(i.contado)?'—':esc(i.contado))+'</b></td>'+(prat?'':'<td class="'+cls+'">'+difTxt+'</td>')+'</tr>';
  });
  h+=n?t+'</table></div>':'<div class="vazio">Nada a mostrar'+(so?' (sem divergências 🎉)':'')+'.</div>';
  if(fabAtual&&fabAtual.length){
    h+='<div style="margin-top:16px"><b style="color:var(--or)">⚠ Códigos do fabricante</b>'+
       '<p class="sub" style="margin:4px 0 6px">Bipados fora da base carregada — NÃO contados, só auditoria (peças que trocaram de código).</p>'+
       '<div class="rolar"><table><tr><th>Código</th><th>Bipes</th><th>1º bipe</th><th>Último</th><th>Modo</th></tr>';
    fabAtual.forEach(function(f){h+='<tr><td class="mono">'+esc(f.codigo)+'</td><td>'+esc(f.bipes)+'</td><td>'+esc(f.primeiro)+'</td><td>'+esc(f.ultimo)+'</td><td>'+esc(f.modo)+'</td></tr>'});
    h+='</table></div></div>';
  }
  document.getElementById('cardDetalhe').innerHTML=h;
}
function exportarXlsx(){
  if(!itensAtual.length)return;
  var dados=itensAtual.map(function(i){
    var temSaldo=!vazioCont(i.saldo);
    return {'Código':i.codigo,'Descrição':i.descricao,'Localização':i.local,
            'Tamanho':i.tamanho||'','Cor':i.cor||'','Saldo Sistema':i.saldo,
            'Contado':i.contado,'Diferença':temSaldo?Number(i.contado||0)-Number(i.saldo||0):'',
            'Extra':i.extra||''};
  });
  var ws=XLSX.utils.json_to_sheet(dados);

// ===== CRUZAMENTO (contado × estoque, ou contagem × contagem) =====
var anaResult=[],anaMulti=false,anaRotulos=[],anaContNome='',anaCat=null;
function cruzarMarcadas(){
  var ids=Array.from(document.querySelectorAll('.chkCont:checked')).map(function(x){return x.value});
  if(!ids.length){alert('Marque pelo menos uma contagem');return}
  cruzarIds(ids);
}
function cruzarIds(ids){
  var conts=ids.map(function(id){return contagens.filter(function(x){return String(x.id)===String(id)})[0]}).filter(Boolean);
  if(!conts.length)return;
  var locs={};conts.forEach(function(c){locs[String(c.locacao||'')]=1});
  if(conts.length>1&&Object.keys(locs).length>1&&!confirm('As contagens marcadas são de locais diferentes ('+Object.keys(locs).join(', ')+').\n\nO cruzamento compara valor a valor: o que estiver só numa delas aparece como RECONTAR. Cruzar mesmo assim?'))return;
  anaCat=catDe(conts[0]);
  anaMulti=conts.length>1;
  anaContNome=conts.length===1?((conts[0].nome||conts[0].modo)+' '+(conts[0].locacao||'')):'cruzamento-'+conts.length+'-contagens';
  anaRotulos=conts.map(function(c){return (c.num_contagem?c.num_contagem+'ª ':'')+(c.conferente||c.nome||'')});
  var card=document.getElementById('anaCard');card.style.display='block';
  card.innerHTML='<div class="vazio">'+(anaMulti?'Cruzando '+conts.length+' contagens entre si e com o estoque…':'Cruzando com o estoque…')+'</div>';
  card.scrollIntoView({behavior:'smooth'});
  carregarEstoque(function(){
    api({action:'getItensLote',ids:conts.map(function(c){return c.id}).join(',')}).then(function(j){
      var res=conts.map(function(c){return {cont:c,itens:(j.ok&&j.itens&&j.itens[c.id])||[]}});
      anaResult=[];
      if(!anaMulti){
        res[0].itens.forEach(function(i){if(vazioCont(i.contado))return;anaResult.push(_cruzarComEstoque(i.codigo,i.descricao,Number(i.contado)||0))});
      }else{
        var agg={},ordem=[];
        res.forEach(function(r,ci){
          r.itens.forEach(function(i){
            if(vazioCont(i.contado))return;
            var k=String(i.codigo).toUpperCase();
            if(!agg[k]){agg[k]={codigo:i.codigo,descricao:i.descricao||'',local:i.local||'',saldoBase:i.saldo,vals:conts.map(function(){return null})};ordem.push(k)}
            agg[k].vals[ci]=(agg[k].vals[ci]||0)+(Number(i.contado)||0);
            if(!agg[k].descricao&&i.descricao)agg[k].descricao=i.descricao;
            if(vazioCont(agg[k].saldoBase)&&!vazioCont(i.saldo))agg[k].saldoBase=i.saldo;
          });
        });
        ordem.forEach(function(k){
          var it=agg[k],vals=it.vals.map(function(v){return v===null?0:v});
          var mx=Math.max.apply(null,vals),mn=Math.min.apply(null,vals),confere=(mx===mn),row;
          if(confere){row=_cruzarComEstoque(it.codigo,it.descricao,mx);row.obs=row.obs||'✓ contagens conferem'}
          else{row=_cruzarComEstoque(it.codigo,it.descricao,null);row.contado=null;row.dif=null;row.obs='⚠ RECONTAR — '+(mx-mn)+' un de diferença entre as contagens'}
          row.vals=vals;row.confere=confere;row.divergeN=mx-mn;row.local=it.local;row.saldoBase=it.saldoBase;
          anaResult.push(row);
        });
      }
      renderAnalise();
    }).catch(function(){card.innerHTML='<div class="vazio">Falha ao carregar os itens. Tente de novo.</div>'});
  });
}
function _cruzarComEstoque(codigo,descricao,contado){
  var e=estoqueMap[String(codigo).toUpperCase()]||{};
  var contabil=(e.contabil===undefined?null:Number(e.contabil));
  var dif=(contabil===null||contado===null)?null:contado-contabil;
  var compr=(Number(e.reserva)||0)+(Number(e.os)||0)+(Number(e.requisicao)||0)+(Number(e.transito)||0);
  var obs='';
  if(dif!==null&&dif<0&&compr>0)obs='⚠ comprometido (res '+(Number(e.reserva)||0)+'/OS '+(Number(e.os)||0)+') — confira antes de ajustar';
  else if(dif!==null&&dif!==0)obs='ajustar '+(dif>0?'+':'')+dif;
  return {codigo:codigo,desc:e.desc||descricao||'',contado:contado,contabil:contabil,disponivel:e.disponivel,
    reserva:e.reserva,os:e.os,dif:dif,obsoleto:e.obsoleto||'',ult_venda:e.ult_venda||'',obs:obs};
}
function renderAnalise(){
  var card=document.getElementById('anaCard');if(!card)return;
  var soEl=document.getElementById('anaSoDiv'),so=soEl?soEl.checked:true;
  function ehDiv(r){return anaMulti?(r.confere===false):(r.dif!==null&&r.dif!==0)}
  var rows=anaResult.filter(function(r){return so?ehDiv(r):true}),nDiv=anaResult.filter(ehDiv).length;
  var cat=acharCat(anaCat)||{};
  var h='<div class="linha entre"><h2>🔎 '+(anaMulti?'Cruzamento de '+anaRotulos.length+' contagens':'Contado × estoque')+'</h2><div class="linha" style="margin:0">'+
    '<label class="chk"><input type="checkbox" id="anaSoDiv" '+(so?'checked':'')+' onchange="renderAnalise()"> só divergentes</label>'+
    '<button class="btn gn" onclick="exportarAnalise()">⬇ Excel</button></div></div>'+
    '<p class="sub">'+(estoqueMeta?'Estoque: base do dia de '+fmtData(estoqueMeta.gerado_em)+' (saldo contábil ao vivo da MCN).':'Base do dia ainda não gerada — sem o saldo contábil, a coluna Contábil fica "?".')+'</p>'+
    '<div class="kpis"><div class="kpi"><b>'+fmtN(anaResult.length)+'</b><span>itens</span></div>'+
    (anaMulti?'<div class="kpi"><b style="color:var(--gn)">'+fmtN(anaResult.length-nDiv)+'</b><span>✓ conferem</span></div><div class="kpi"><b style="color:'+(nDiv?'var(--dg)':'var(--gn)')+'">'+fmtN(nDiv)+'</b><span>⚠ recontar</span></div>'
     :'<div class="kpi"><b style="color:'+(nDiv?'var(--dg)':'var(--gn)')+'">'+fmtN(nDiv)+'</b><span>divergentes × estoque</span></div>')+'</div>';
  if(anaMulti&&nDiv&&cat.base)h+='<div class="linha"><button class="btn" onclick="gerarBaseRecontagem(\''+cat.base+'\',anaResult.filter(function(r){return r.confere===false}))">📥 Gerar base de recontagem ('+nDiv+' divergentes)</button><span class="sub" id="recSt" style="margin:0"></span></div>';
  if(!rows.length){card.innerHTML=h+'<div class="vazio">Nada a mostrar'+(so?' (sem divergências 🎉)':'')+'.</div>';return}
  var colsCont=anaMulti?anaRotulos.map(function(rot){return '<th title="'+esc(rot)+'">'+esc(rot.length>14?rot.substring(0,13)+'…':rot)+'</th>'}).join(''):'<th>Cont.</th>';
  h+='<div class="rolar"><table><tr><th>Código</th><th>Descrição</th>'+colsCont+(anaMulti?'<th>Status</th>':'')+'<th>Contábil</th><th>Dif.</th><th>Disp.</th><th>Res/OS</th><th>Últ. venda</th><th>Obs.</th></tr>';
  rows.forEach(function(r){
    var dcls=r.dif===null?'':r.dif===0?'dif-ok':r.dif>0?'dif-mais':'dif-menos';
    var dtxt=r.dif===null?(anaMulti&&!r.confere?'—':'?'):r.dif===0?'OK':(r.dif>0?'+':'')+r.dif;
    var tds=anaMulti?r.vals.map(function(v){return '<td><b>'+v+'</b></td>'}).join('')+'<td>'+(r.confere?'<span class="badge b-gn">✓ confere</span>':'<span class="badge b-dg">⚠ ±'+r.divergeN+'</span>')+'</td>':'<td><b>'+r.contado+'</b></td>';
    h+='<tr><td class="mono">'+esc(r.codigo)+(r.obsoleto?' <span class="badge b-dg">OBS</span>':'')+'</td><td>'+esc(r.desc)+'</td>'+tds+
      '<td>'+(r.contabil===null?'?':r.contabil)+'</td><td class="'+dcls+'">'+dtxt+'</td><td>'+(r.disponivel===undefined?'—':esc(r.disponivel))+'</td>'+
      '<td>'+(Number(r.reserva)||0)+'/'+(Number(r.os)||0)+'</td><td>'+esc(r.ult_venda||'nunca')+'</td><td style="font-size:11px">'+esc(r.obs)+'</td></tr>';
  });
  card.innerHTML=h+'</table></div>';
}
function exportarAnalise(){
  if(!anaResult.length){alert('Rode uma análise primeiro');return}
  var dados=anaResult.map(function(r){
    var d={'Código':r.codigo,'Descrição':r.desc};
    if(anaMulti){r.vals.forEach(function(v,i){d[anaRotulos[i]||('Contagem '+(i+1))]=v});d['Status']=r.confere?'confere':'DIVERGE ±'+r.divergeN}
    else d['Contado']=r.contado;
    d['Saldo Contábil']=r.contabil;d['Diferença']=r.dif;d['Disponível']=r.disponivel;d['Reserva']=r.reserva;d['O.S.']=r.os;
    d['Obsoleto']=r.obsoleto;d['Última Venda']=r.ult_venda;d['Observação']=r.obs;
    return d;});
  var ws=XLSX.utils.json_to_sheet(dados);var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Análise');
  XLSX.writeFile(wb,('Analise-'+anaContNome+'.xlsx').replace(/[\/:*?"<>|]/g,'-'));
}
// rows: [{codigo, desc, local, saldoBase|sistema}] — sobe como nova versão de base
function gerarBaseRecontagem(tipo,rows){
  if(!rows.length){alert('Sem divergentes para recontar');return}
  var st=document.getElementById('recSt');
  if(!confirm('Subir base de recontagem ('+tipo+') com '+rows.length+' código'+(rows.length>1?'s':'')+'?\nEla vira uma nova versão no histórico — na coletora, use 📚 Escolher base.'))return;
  var pecas=rows.map(function(r){
    var saldo=!vazioCont(r.saldoBase)?(Number(r.saldoBase)||0):(r.sistema!==undefined?r.sistema:(r.contabil||0));
    var loc=r.local||'';
    if(tipo==='locacao')return {codigo:r.codigo,loc:loc||'RECONTAGEM',saldo:saldo,curva:'',marca:'',ultEntrada:'',ultSaida:''};
    if(tipo==='diaria')return {codigo:r.codigo,desc:r.desc,loc:loc,saldo:saldo,qtdMov:0};
    return {codigo:r.codigo,desc:r.desc,tipo:'RECONTAGEM',loc:loc,saldo:saldo};
  });
  if(st)st.textContent='Enviando '+pecas.length+' peças…';
  postAdmin({action:'upload_base',tipo:tipo,por:'recontagem (divergentes)',pecas:pecas}).then(function(j){
    var t=j.ok?'✅ Base de recontagem no ar ('+j.n+' peças). Na coletora: abra o modo, toque 📚 Escolher base e pegue a versão "recontagem".':'Falha: '+(j.erro||'?');
    if(st)st.textContent=t;else alert(t);
  }).catch(function(){if(st)st.textContent='Falha ao enviar — tente de novo.'});
}

function diaDe(c){var d=new Date(c.recebido_em);return isNaN(d)?'?':d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

    var p=k.split('-'),dt=new Date(+p[0],+p[1]-1,+p[2]);

// Porta do inventario.acuracia() do bot (whatsapp-agente-claude/inventario.py).
// rodadas: [{rot, ct:{COD:qtd}}] em ordem cronológica; a última é a referência.
// sal: {COD:{cont, desc}}; nunca: {COD:{saldo,desc}} (varrido e não achado = 0).
function acuraciaInv(rodadas,sal,nunca){
  var ref=Object.assign({},rodadas[rodadas.length-1].ct),S2=Object.assign({},sal);
  Object.keys(nunca||{}).forEach(function(c){if(ref[c]!==undefined)return;if(!S2[c])S2[c]={cont:nunca[c].saldo,desc:nunca[c].desc};ref[c]=0});
  var u={};rodadas.forEach(function(r){Object.keys(r.ct).forEach(function(c){u[c]=1})});Object.keys(ref).forEach(function(c){u[c]=1});
  Object.keys(S2).forEach(function(c){if(S2[c].cont!==null&&S2[c].cont!==undefined)u[c]=1});
  var cods=Object.keys(u).filter(function(c){return S2[c]&&S2[c].cont!==null&&S2[c].cont!==undefined}).sort();
  if(!cods.length)return null;
  var S=0,F=0,E=0,erros={};
  cods.forEach(function(c){S+=S2[c].cont;F+=(ref[c]||0);erros[c]=(ref[c]||0)-S2[c].cont;E+=Math.abs(erros[c])});
  var exatos=cods.filter(function(c){return erros[c]===0});
  var iguais=cods.filter(function(c){if(!rodadas.every(function(r){return r.ct[c]!==undefined}))return false;var v={};rodadas.forEach(function(r){v[r.ct[c]]=1});return Object.keys(v).length===1});
  var baseConf=cods.filter(function(c){return rodadas.some(function(r){return r.ct[c]!==undefined})});if(!baseConf.length)baseConf=cods;
  var nF=0,nS=0;cods.forEach(function(c){if(erros[c]<0)nF-=erros[c];else nS+=erros[c]});
  return {cods:cods,S:S,F:F,E:E,erros:erros,ref:ref,sal:S2,exatos:exatos.length,iguais:iguais,n_falta:nF,n_sobra:nS,
    ac_codigo:100*exatos.length/cods.length,ac_peca:S?100*(1-E/S):0,liquida:S?100*(F-S)/S:0,confianca:100*iguais.length/baseConf.length,
    firme:iguais.filter(function(c){return erros[c]!==0}).length};
}
function calcularCapacetes(){
  var ids=Array.from(document.querySelectorAll('.capRod:checked')).map(function(x){return x.value});
  var comPrat=document.getElementById('capPrat').checked,completa=document.getElementById('capCompleta').checked;
  var res=document.getElementById('capRes');
  if(!ids.length&&!comPrat){res.innerHTML='<div class="nota av">Marque ao menos uma rodada.</div>';return}
  res.innerHTML='<div class="vazio">Calculando…</div>';
  var conts=ids.map(function(id){return contagens.filter(function(c){return String(c.id)===id})[0]}).filter(Boolean);
  carregarEstoque(function(){carregarMapa(function(){carregarBaseCap(function(){
    var precisa=conts.filter(function(c){return !capItens[c.id]}).map(function(c){return c.id});
    var go=function(){
      var rodadas=[],salBase={},descs={},universo={};
      conts.forEach(function(c){
        var ct={};
        (capItens[c.id]||[]).forEach(function(i){
          var k=String(i.codigo).toUpperCase();descs[k]=descs[k]||i.descricao||'';universo[k]=1;
          if(!vazioCont(i.saldo)&&salBase[k]===undefined)salBase[k]=Number(i.saldo)||0;
          if(!vazioCont(i.contado))ct[k]=(ct[k]||0)+(Number(i.contado)||0);
        });
        rodadas.push({rot:rotRodada(c)+' '+fmtData(c.recebido_em).slice(11),t:new Date(c.recebido_em).getTime()||0,ct:ct});
      });
      if(comPrat&&mapa.locais.length){
        var ct={},t=0;mapa.locais.forEach(function(l){t=Math.max(t,new Date(l.recebido_em).getTime()||0);l.itens.forEach(function(i){var k=String(i.codigo).toUpperCase();ct[k]=(ct[k]||0)+i.qtd;descs[k]=descs[k]||i.descricao})});
        rodadas.push({rot:'🗄️ Prateleiras',t:t,ct:ct});
      }
      rodadas.sort(function(a,b){return a.t-b.t});
      var mx=Math.max.apply(null,rodadas.map(function(r){return Object.keys(r.ct).length}).concat([0]));
      rodadas.forEach(function(r){r.n=Object.keys(r.ct).length;r.parcial=r.n<mx*0.6});
      var validas=rodadas.filter(function(r){return !r.parcial});
      if(!validas.length){res.innerHTML='<div class="nota av">Nenhuma rodada com contagem.</div>';return}
      // saldo do sistema: contábil ao vivo (base do dia) > saldo da base usada na contagem
      var sal={},fonteVivo=0,fonteBase=0,todos={};
      validas.forEach(function(r){Object.keys(r.ct).forEach(function(k){todos[k]=1})});
      if(completa)Object.keys(baseCap).forEach(function(k){todos[k]=1;universo[k]=1;descs[k]=descs[k]||baseCap[k].desc;if(salBase[k]===undefined)salBase[k]=baseCap[k].saldo});
      Object.keys(todos).forEach(function(k){
        var e=estoqueMap[k];
        if(e&&e.contabil!==undefined&&e.contabil!==''){sal[k]={cont:Number(e.contabil)||0,desc:e.desc||descs[k]};fonteVivo++}
        else if(salBase[k]!==undefined){sal[k]={cont:salBase[k],desc:descs[k]};fonteBase++}
      });
      var nunca={};
      if(completa)Object.keys(universo).forEach(function(k){
        if(validas.some(function(r){return r.ct[k]!==undefined}))return;
        if(sal[k]&&sal[k].cont>0)nunca[k]={saldo:sal[k].cont,desc:sal[k].desc};
      });
      // só entra na conta quem foi contado ou é "nunca" (saldo>0 não bipado)
      var salConta={};Object.keys(sal).forEach(function(k){if(nunca[k]||validas.some(function(r){return r.ct[k]!==undefined}))salConta[k]=sal[k]});
      var m=acuraciaInv(validas,salConta,nunca);
      capResult={m:m,rodadas:rodadas,validas:validas,nunca:nunca,descs:descs,fonteVivo:fonteVivo,fonteBase:fonteBase};
      renderCapacetesRes();renderCapKpis();
    };
    if(!precisa.length){go();return}
    api({action:'getItensLote',ids:precisa.join(',')}).then(function(j){precisa.forEach(function(id){capItens[id]=(j.ok&&j.itens&&j.itens[id])||[]});go()})
    .catch(function(){res.innerHTML='<div class="nota av">Falha ao carregar os itens.</div>'});
  })})});
}

  h+='<div class="linha"><select id="capFiltro" onchange="renderCapTabela()"><option value="div">Só divergentes</option><option value="rec">Só recontar (rodadas discordam)</option><option value="sis">Só erro do sistema (rodadas concordam)</option><option value="todos">Todos</option></select>'+
    '<button class="btn gn" onclick="exportarCapacetes()">⬇ Excel</button>'+
    (uma?'':'<button class="btn" onclick="recontarCapacetes()">📥 Base de recontagem (discordam)</button>')+'<span class="sub" id="recSt" style="margin:0"></span></div><div id="capTab"></div>';

function linhasCap(){
  var r=capResult,m=r.m,uma=r.validas.length<2,ig={};m.iguais.forEach(function(c){ig[c]=1});
  return m.cods.map(function(c){
    var vals=r.validas.map(function(x){return x.ct[c]===undefined?null:x.ct[c]});
    // recontar = alguma rodada contou e elas não deram o mesmo número. Capacete
    // com saldo que nenhuma rodada achou é FALTA (como no laudo), não recontagem.
    var contado=vals.some(function(v){return v!==null}),e=m.erros[c],st;
    var discorda=!uma&&contado&&!ig[c];
    if(discorda)st='rec';else if(e===0)st='ok';else if(!contado||uma)st=e<0?'falta':'sobra';else st='sis';
    return {codigo:c,desc:(m.sal[c]&&m.sal[c].desc)||r.descs[c]||'',vals:vals,sistema:m.sal[c].cont,fisico:m.ref[c]||0,dif:e,st:st,nunca:!!r.nunca[c]};
  });
}
function renderCapTabela(){
  var f=document.getElementById('capFiltro').value,r=capResult;
  var ls=linhasCap().filter(function(l){return f==='todos'?true:f==='div'?l.dif!==0||l.st==='rec':f==='rec'?l.st==='rec':l.st==='sis'});
  ls.sort(function(a,b){return Math.abs(b.dif)-Math.abs(a.dif)});
  var el=document.getElementById('capTab');
  if(!ls.length){el.innerHTML='<div class="vazio">Nada nesse filtro 🎉</div>';return}
  var ST={ok:'<span class="badge b-gn">✓ exato</span>',rec:'<span class="badge b-dg">⚠ recontar</span>',sis:'<span class="badge b-or">ajustar sistema</span>',falta:'<span class="badge b-dg">falta</span>',sobra:'<span class="badge b-bl">sobra</span>'};
  var h='<div class="rolar"><table><tr><th>Código</th><th>Descrição</th>'+r.validas.map(function(x){return '<th>'+esc(x.rot.length>14?x.rot.substring(0,13)+'…':x.rot)+'</th>'}).join('')+'<th>Sistema</th><th>Dif.</th><th>Status</th></tr>';
  ls.slice(0,400).forEach(function(l){
    var cls=l.dif===0?'dif-ok':l.dif>0?'dif-mais':'dif-menos';
    h+='<tr><td class="mono">'+esc(l.codigo)+'</td><td>'+esc(l.desc)+'</td>'+l.vals.map(function(v){return '<td>'+(v===null?'<span class="sub" style="margin:0">'+(l.nunca?'0':'—')+'</span>':'<b>'+v+'</b>')+'</td>'}).join('')+
      '<td>'+l.sistema+'</td><td class="'+cls+'">'+(l.dif>0?'+':'')+l.dif+'</td><td>'+ST[l.st]+'</td></tr>';
  });
  el.innerHTML=h+'</table></div>'+(ls.length>400?'<p class="sub">mostrando 400 de '+ls.length+' — baixe o Excel pra lista completa</p>':'');
}
function exportarCapacetes(){
  if(!capResult||!capResult.m)return;

  var dados=linhasCap().map(function(l){var d={'Código':l.codigo,'Descrição':l.desc};r.validas.forEach(function(x,i){d[x.rot]=l.vals[i]===null?'':l.vals[i]});d['Sistema']=l.sistema;d['Físico (ref.)']=l.fisico;d['Diferença']=l.dif;d['Status']=ROT[l.st];return d});
  var m=r.m,ind=[{'Indicador':'Acurácia por código','Valor':m.ac_codigo.toFixed(1)+'%'},{'Indicador':'Acurácia por peça','Valor':m.ac_peca.toFixed(1)+'%'},{'Indicador':'Divergência líquida','Valor':m.liquida.toFixed(1)+'%'},{'Indicador':'Confiança','Valor':r.validas.length<2?'—':m.confianca.toFixed(1)+'%'},{'Indicador':'Sistema (pç)','Valor':m.S},{'Indicador':'Físico (pç)','Valor':m.F},{'Indicador':'Faltam (pç)','Valor':m.n_falta},{'Indicador':'Sobram (pç)','Valor':m.n_sobra}];
  var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(ind),'Indicadores');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(dados),'Códigos');
  XLSX.writeFile(wb,'Inventario-capacetes-'+new Date().toISOString().substring(0,10)+'.xlsx');
}

function carregarEstoque(cb){
  if(estoqueDB){cb&&cb();return}
  api({action:'getEstoque'}).then(function(j){
    estoqueDB=(j.ok&&j.pecas)||[];estoqueMeta=j.meta||null;estoqueMap={};
    estoqueDB.forEach(function(p){estoqueMap[String(p.codigo).toUpperCase()]=p});
    cb&&cb();
  }).catch(function(){estoqueDB=[];cb&&cb()});
}
function fmtRS(n){return 'R$ '+(Number(n)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function mesesDesde(dstr){
  if(!dstr)return Infinity; // nunca vendeu
  var p=String(dstr).substring(0,10).split('/');if(p.length!==3)return Infinity;
  var d=new Date(+p[2],+p[1]-1,+p[0]);if(isNaN(d))return Infinity;
  return (Date.now()-d.getTime())/(1000*60*60*24*30.44);
}

var HTML_BASES='<div class="card"><p class="sub" style="margin-bottom:8px">Suba aqui a planilha do Microwork — as coletoras baixam a base sozinhas (não se importa mais planilha no aparelho).</p>'+
  '<div class="linha"><label style="font-size:13px;color:var(--tx2)">Quem está enviando:</label><input id="inpPor" placeholder="seu nome" style="width:180px"></div></div>'+
  [['capacetes','🪖 Base da Contagem de Capacetes','(Listagem de Mercadoria — filtra capacetes dos tipos CAPACETES+BOUTIQUE, inclui saldo zero; usada também pela contagem por prateleira)'],
   ['diaria','📊 Base da Contagem Diária','(Saída de Mercadoria)'],
   ['locacao','📍 Base da Contagem por Locação','(Planilha de Localização)'],
   ['tipo','🏷️ Base da Contagem por Tipo','(Listagem de Mercadoria com a coluna Tipo Mercadoria)']].map(function(b){
    return '<div class="card"><b>'+b[1]+'</b> <span class="sub" style="display:inline">'+b[2]+'</span>'+
      '<p class="sub" id="meta-'+b[0]+'" style="margin:6px 0">…</p>'+
      '<div class="linha"><input type="file" id="file-'+b[0]+'" accept=".xlsx,.xls,.csv"><button class="btn" onclick="uploadBase(\''+b[0]+'\')">Enviar base</button></div>'+
      '<p class="sub" id="st-'+b[0]+'"></p><div id="hist-'+b[0]+'"></div></div>'}).join('');
function normalizarLoc(loc){if(!loc)return 'SEM LOCAL';loc=loc.trim().toUpperCase();if(loc===''||loc==='0'||loc==='00'||loc==='[SEM LOCAL]')return 'SEM LOCAL';return loc}
function formatarDataXlsx(v){
  if(!v&&v!==0)return '';
  if(typeof v==='number'){
    if(v<1)return '';
    var d=new Date(Date.UTC(1899,11,30+Math.floor(v)));
    if(isNaN(d.getTime()))return String(v);
    var dd=String(d.getUTCDate()).padStart(2,'0'),mm=String(d.getUTCMonth()+1).padStart(2,'0'),yy=d.getUTCFullYear();
    if(yy<1901)return '';
    return dd+'/'+mm+'/'+yy;
  }
  return String(v).trim();
}
function renderBases(){
  api('action=getBases').then(function(j){
    if(!j.ok)return;
    ['diaria','locacao','tipo','capacetes'].forEach(function(t){
      var m=j.bases[t];
      document.getElementById('meta-'+t).textContent=m?('Base atual: '+fmtData(m.enviado_em)+' · '+m.n+' peças'+(m.por?' · enviada por '+m.por:'')):'Nenhuma base enviada ainda.';
    });
  });
  renderHistBases();
}
function renderHistBases(){
  api('action=getBasesHist').then(function(j){
    if(!j.ok)return;
    var porTipo={};
    (j.versoes||[]).forEach(function(v){(porTipo[v.tipo]=porTipo[v.tipo]||[]).push(v)});
    ['diaria','locacao','tipo','capacetes'].forEach(function(t){
      var el=document.getElementById('hist-'+t);if(!el)return;
      var vs=porTipo[t]||[];
      if(!vs.length){el.innerHTML='';return}
      var h='<div class="sub" style="margin:8px 0 4px">📚 Histórico de bases ('+vs.length+') — o contador escolhe qual contar na coletora:</div>';
      vs.forEach(function(v,i){
        h+='<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid rgba(42,46,66,.4)">'+
           '<span style="font-size:12px">'+(i===0?'<span class="badge b-gn">mais nova</span> ':'')+fmtData(v.enviado_em)+' · <b>'+v.n_pecas+'</b> peças'+(v.por?' · '+v.por:'')+'</span>'+
           '<button class="btn sec" style="padding:3px 9px;font-size:12px" onclick="deleteBaseVersao(\''+v.versao_id+'\',\''+t+'\')">🗑 apagar</button></div>';
      });
      el.innerHTML=h;
    });
  });
}
function deleteBaseVersao(vid,tipo){
  if(!confirm('Apagar esta versão da base de '+tipo+'?\nNão dá pra desfazer.'))return;
  fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action:'deleteBase',senha:senha(),versao_id:vid})})
  .then(function(r){return r.json()}).then(function(j){
    if(j.ok)renderBases();else alert('Falha: '+(j.erro||'?'));
  }).catch(function(){alert('Falha ao apagar — tente de novo')});
}
function lerPlanilha(file,cb){
  var reader=new FileReader();
  reader.onload=function(e){
    var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
    var ws=wb.Sheets[wb.SheetNames[0]];
    cb(XLSX.utils.sheet_to_json(ws,{defval:'',raw:true}));
  };
  reader.readAsArrayBuffer(file);
}
function uploadBase(tipo){
  var inp=document.getElementById('file-'+tipo);
  var file=inp.files[0];if(!file){alert('Escolha a planilha primeiro');return}
  var por=document.getElementById('inpPor').value.trim();
  localStorage.setItem('inv_dash_por',por);
  var st=document.getElementById('st-'+tipo);st.textContent='Lendo planilha…';
  lerPlanilha(file,function(json){
    var pecas=[],vistos={};
    for(var i=0;i<json.length;i++){
      var r=json[i];
      if(tipo==='diaria'){
        var cod=String(r['Código Mercadoria']||r['Codigo Mercadoria']||r['Código']||r['Codigo']||'').trim();
        if(!cod)continue;
        var merc=String(r['Mercadoria']||r['Descrição']||r['Descricao']||'').trim();
        var loc=String(r['Localização']||r['Localizacao']||r['Local']||r['Local/Grade']||'').trim();
        var qtdMov=r['Quantidade']||r['Qtd']||0;
        var saldoRaw=r['Saldo Disponível Atual']||r['Saldo Disponível']||r['Saldo Contábil']||r['Saldo Contabil']||r['Saldo']||0;
        var saldo=typeof saldoRaw==='number'?Math.round(saldoRaw):parseInt(String(saldoRaw).replace(/\./g,'').replace(',','.'))||0;
        if(vistos[cod]!==undefined){if(saldo>pecas[vistos[cod]].saldo)pecas[vistos[cod]].saldo=saldo}
        else{vistos[cod]=pecas.length;pecas.push({codigo:cod,desc:merc,loc:loc,saldo:saldo,qtdMov:qtdMov})}
      }else if(tipo==='tipo'){
        var cod3=String(r['Código Mercadoria']||r['Codigo Mercadoria']||r['Código']||'').trim();
        if(!cod3||cod3.length<3)continue;
        var tp=String(r['Tipo Mercadoria']||r['Tipo de Mercadoria']||r['Tipo de mercadoria']||r['Tipo']||'').trim().toUpperCase()||'SEM TIPO';
        var desc3=String(r['Descrição Mercadoria']||r['Descricao Mercadoria']||r['Descrição']||r['Mercadoria']||'').trim();
        var loc3=String(r['Localizações']||r['Localizacoes']||r['Localização']||r['Localizacao']||r['Local']||'').replace(/[\[\]]/g,'').replace(/SEM LOCAL/g,'').trim();
        var sRaw3=r['Saldo Disponível']||r['Saldo Disponivel']||r['Saldo Contábil']||r['Saldo Contabil']||r['Saldo']||0;
        var s3=typeof sRaw3==='number'?Math.round(sRaw3):Math.round(parseFloat(String(sRaw3).replace(/\./g,'').replace(',','.'))||0);
        if(s3<=0)continue;
        if(vistos[cod3]!==undefined){if(s3>pecas[vistos[cod3]].saldo)pecas[vistos[cod3]].saldo=s3}
        else{vistos[cod3]=pecas.length;pecas.push({codigo:cod3,desc:desc3,tipo:tp,loc:loc3,saldo:s3})}
      }else if(tipo==='capacetes'){
        // capacetes: tipos CAPACETES+BOUTIQUE, só descrição CAPACETE (sem chuva/viseira/pala/kit), INCLUI saldo 0
        var cod4=String(r['Código Mercadoria']||r['Codigo Mercadoria']||r['Código']||'').trim();
        if(!cod4||cod4.length<3)continue;
        var tp4=String(r['Tipo Mercadoria']||r['Tipo de Mercadoria']||r['Tipo']||'').trim().toUpperCase();
        if(tp4!=='CAPACETES'&&tp4!=='BOUTIQUE')continue;
        var desc4=String(r['Descrição Mercadoria']||r['Descricao Mercadoria']||r['Descrição']||r['Mercadoria']||'').trim();
        var du4=desc4.toUpperCase();
        if(du4.indexOf('CAPACETE')===-1&&du4.indexOf('CAP ')!==0)continue;
        if(/CHUVA|VISEIRA|VIS\.|PALA|KIT|REPARO|MECANISMO|ORELHA|BOTAO|BOTÃO|BAIONETA|FIXA|TRAVA|NYLON/.test(du4))continue;
        var loc4=String(r['Localizações']||r['Localizacoes']||r['Localização']||r['Localizacao']||r['Local']||'').replace(/[\[\]]/g,'').replace(/SEM LOCAL/g,'').trim();
        var sRaw4=r['Saldo Disponível']||r['Saldo Disponivel']||r['Saldo Contábil']||r['Saldo Contabil']||r['Saldo']||0;
        var s4=typeof sRaw4==='number'?Math.round(sRaw4):Math.round(parseFloat(String(sRaw4).replace(/\./g,'').replace(',','.'))||0);
        if(vistos[cod4]!==undefined){if(s4>pecas[vistos[cod4]].saldo)pecas[vistos[cod4]].saldo=s4}
        else{vistos[cod4]=pecas.length;pecas.push({codigo:cod4,desc:desc4,tipo:tp4,loc:loc4,saldo:s4})}
      }else{
        var cod2=String(r['Código Mercadoria']||r['Codigo Mercadoria']||r['Código']||'').trim();
        var loc2=normalizarLoc(String(r['Localização']||r['Localizacao']||r['Local']||r['localização']||''));
        var sRaw=String(r['Saldo Disponível']||r['Saldo Disponivel']||r['Saldo']||'0');
        var s2=Math.round(parseFloat(sRaw.replace(/\./g,'').replace(',','.'))||0);
        var curva=String(r['ABCD/XYZ']||r['Curva']||'').trim();
        var marca=String(r['Marca']||'').trim();
        if(cod2&&cod2.length>=3&&s2>0)pecas.push({codigo:cod2,loc:loc2,saldo:s2,curva:curva,marca:marca,
          ultEntrada:formatarDataXlsx(r['Última Entrada']||r['Ultima Entrada']||''),
          ultSaida:formatarDataXlsx(r['Última Saída']||r['Ultima Saida']||'')});
      }
    }
    if(tipo==='diaria')pecas.sort(function(a,b){return String(a.loc).localeCompare(String(b.loc))});
    if(!pecas.length){st.textContent='Nenhuma peça reconhecida — confira as colunas da planilha.';return}
    st.textContent='Enviando '+pecas.length+' peças…';
    fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action:'upload_base',senha:senha(),tipo:tipo,por:por,pecas:pecas})})
    .then(function(r){return r.json()}).then(function(j){
      if(j.ok){st.textContent='✅ Base enviada: '+j.n+' peças. As coletoras já podem buscar.';inp.value='';renderBases()}
      else st.textContent='Falha: '+(j.erro||'?');
    }).catch(function(){st.textContent='Falha ao enviar — tente de novo.'});
  });
}
